name: Auto Merge main into dev (Using PAT Secret)

on:
  # Triggers when a Pull Request is closed
  pull_request:
    # Specifically targets PRs merged into the 'main' branch
    branches:
      - main

jobs:
  auto_merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Pull Request from main to dev
        # Uses the repo-sync/pull-request action to create the new PR
        uses: repo-sync/pull-request@v2
        with:
          # Use your custom secret containing the PAT you generated.
          # The PAT must have the 'repo' scope enabled.
          GITHUB_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }} 
          
          # The source branch is where the changes came from (main)
          source_branch: "main"
          
          # The destination branch is where the changes will go (dev)
          destination_branch: "dev"
          
          # Set a clear title for the automatically created PR
          pr_title: "🤖 Auto-Merge: main changes into dev"
          
          # Add a label to easily identify auto-generated PRs
          pr_label: "auto-merge"
          
          # Auto-merge the PR if there are no conflicts
          auto_merge: true 
          
          # Set the auto-merge method
          auto_merge_method: "merge"