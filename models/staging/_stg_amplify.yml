version: 2

models:
  - name: stg_amplify__user_event
    description: > 
      This is the staging model for the events by an user on the amplify product.
      This model parses key-pair json in flattened attributes.

    columns:
      - name: id
        description: Event ID base on the amplify event activity
        data_tests:
          - unique
          - not_null
      - name: object_name
        description: "{{ doc('object_name') }}"
      - name: product_name
        description: "{{ doc('product_name') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: verb_name
        description: "{{ doc('verb_name') }}"
      - name: event_ts
        description: "{{ doc('event_ts') }}"
      - name: source_name
        description: This is a metafield which identifies the source, in this case 'amplify'
      - name: updated_at_ts
        description: "{{ doc('updated_at_ts') }}"    
