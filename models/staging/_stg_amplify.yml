version: 2

models:
  - name: stg_amplify__user_event
    description: > 
      This is the staging model for the events by an user on the amplify product.
      This model parses key-pair json in flattened attributes.

    columns:
      - name: id
        description: Event ID base on the amplify event activity
        data_tests:
          - unique
          - not_null
      - name: object
        description: tbd
      - name: product_name
        description: Name of the product, currently populated with values 'science' and 'ela'
      - name: user_id
        description: User ID
      - name: verb
        description: This field determines the action of the uer. e.g. selected
      - name: event_ts
        description: A timestamp field that determines the timestamp when the event occurred.
      - name: source_name
        description: This is a metafield which identifies the source, in this case 'amplify'
      - name: dw_insert_ts
        description: This field provide us the UTC timestamp when this table/view was built 
    
